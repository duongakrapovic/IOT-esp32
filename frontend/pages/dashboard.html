<!-- Khối Biểu đồ Overview -->
<div class="panel">
    <header class="panel-header">
        <div class="header-title">
            <h1>Sensor Overview</h1>
            <p class="subtitle">Last 2 hours · 5-min intervals</p>
        </div>

        <!-- Nút gạt Light / Dark theo ảnh mẫu -->
        <div class="theme-toggle-box">
            <span class="theme-text" id="label-light">Light</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-checkbox" onchange="toggleTheme(this.checked)">
                <span class="theme-slider"></span>
            </label>
            <span class="theme-text active" id="label-dark">Dark</span>
        </div>
    </header>

    <div class="chart-container">
        <canvas id="sensorChart"></canvas>
    </div>
</div>

<!-- Hàng dưới: Điều khiển 3 đèn (Trái) & 3 thông số cảm biến (Phải) -->
<div class="dashboard-bottom-row">
    <!-- Cột trái: Điều khiển 3 đèn -->
    <div class="panel device-panel">
        <h3 class="panel-title">Device Control</h3>
        <div class="device-list">
            <div class="device-item">
                <span class="device-name">đèn 1</span>
                <label class="switch">
                    <input type="checkbox" id="device-switch-1" checked onchange="toggleDevice(1, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="device-item">
                <span class="device-name">đèn 2</span>
                <label class="switch">
                    <input type="checkbox" id="device-switch-2" checked onchange="toggleDevice(2, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="device-item">
                <span class="device-name">đèn 3</span>
                <label class="switch">
                    <input type="checkbox" id="device-switch-3" checked onchange="toggleDevice(3, this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Cột phải: Dàn hàng ngang 3 thông số cảm biến -->
    <div class="panel stats-panel">
        <h3 class="panel-title">Sensor Values</h3>
        <div class="sensor-stats-horizontal">
            <div class="stat-card temp">
                <h3>TEMPERATURE</h3>
                <p id="temp-value">30.1°C</p>
            </div>
            <div class="stat-card humid">
                <h3>HUMIDITY</h3>
                <p id="humid-value">61%</p>
            </div>
            <div class="stat-card light">
                <h3>LIGHT</h3>
                <p id="light-value">231 Lux</p>
            </div>
        </div>
    </div>
</div>
