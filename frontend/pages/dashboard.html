<!-- Khối Biểu đồ Overview -->
<div class="panel">
    <header class="panel-header">
        <div class="header-title">
            <h1>Sensor Overview</h1>
            <p class="subtitle">Real-time data · 2-sec intervals</p>

            <!-- Nút gạt Light / Dark -->
            <div class="theme-toggle-box">
                <span class="theme-text" id="label-light">Light</span>
                <label class="theme-switch">
                    <input type="checkbox" id="theme-checkbox" onchange="toggleTheme(this.checked)">
                    <span class="theme-slider"></span>
                </label>
                <span class="theme-text active" id="label-dark">Dark</span>
            </div>
        </div>
    </header>

    <div class="chart-container">
        <canvas id="sensorChart"></canvas>
    </div>
</div>

<!-- Hàng dưới: Cột trái (Điều khiển 3 đèn) — Cột phải (3 Thẻ thông số) -->
<div class="dashboard-bottom-row">
    <!-- Cột trái: Điều khiển 3 đèn -->
    <div class="panel device-panel">
        <h3 class="panel-title">Device Control</h3>
        <div class="device-list">
            
            <!-- Đèn 1 (Bỏ checked) -->
            <div class="device-item" id="device-item-1">
                <span class="device-name">Đèn 1</span>
                <div class="device-right">
                    <span class="device-spinner"></span>
                    <img src="./css/bulb-off.svg" class="bulb-icon bulb-off" width="28" height="28" alt="Đèn tắt">
                    <img src="./css/bulb-on.svg" class="bulb-icon bulb-on" width="28" height="28" alt="Đèn bật">
                    <label class="switch">
                        <input type="checkbox" id="device-switch-1" onchange="toggleDevice(1, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Đèn 2 (Bỏ checked) -->
            <div class="device-item" id="device-item-2">
                <span class="device-name">Đèn 2</span>
                <div class="device-right">
                    <span class="device-spinner"></span>
                    <img src="./css/bulb-off.svg" class="bulb-icon bulb-off" width="28" height="28" alt="Đèn tắt">
                    <img src="./css/bulb-on.svg" class="bulb-icon bulb-on" width="28" height="28" alt="Đèn bật">
                    <label class="switch">
                        <input type="checkbox" id="device-switch-2" onchange="toggleDevice(2, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Đèn 3 (Bỏ checked) -->
            <div class="device-item" id="device-item-3">
                <span class="device-name">Đèn 3</span>
                <div class="device-right">
                    <span class="device-spinner"></span>
                    <img src="./css/bulb-off.svg" class="bulb-icon bulb-off" width="28" height="28" alt="Đèn tắt">
                    <img src="./css/bulb-on.svg" class="bulb-icon bulb-on" width="28" height="28" alt="Đèn bật">
                    <label class="switch">
                        <input type="checkbox" id="device-switch-3" onchange="toggleDevice(3, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

        </div>
    </div>

    <!-- Cột phải: 3 thẻ thông số cảm biến -->
    <div class="panel stats-panel">
        <h3 class="panel-title">Sensor Values</h3>
        <div class="sensor-stats-horizontal">
            <div class="stat-card temp">
                <h3>TEMPERATURE</h3>
                <p id="temp-value">-- °C</p>
            </div>
            <div class="stat-card humid">
                <h3>HUMIDITY</h3>
                <p id="humid-value">-- %</p>
            </div>
            <div class="stat-card light">
                <h3>LIGHT</h3>
                <p id="light-value">-- Lux</p>
            </div>
        </div>
    </div>
</div>
