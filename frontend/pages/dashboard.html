<div class="panel">
    <header class="panel-header">

        <div class="header-title">
            <h1>Sensor Overview</h1>

            <p class="subtitle">
                Dữ liệu trực tuyến · Cập nhật liên tục
            </p>

            <div id="hardware-status" class="status-offline">
                Trạng thái: Đang chờ dữ liệu...
            </div>
        </div>


        <div class="sensor-stats">

            <div class="stat-item temp">
                <h3>TEMPERATURE</h3>
                <p id="temp-value">-- °C</p>
            </div>

            <div class="stat-item humid">
                <h3>HUMIDITY</h3>
                <p id="humid-value">-- %</p>
            </div>

            <div class="stat-item light">
                <h3>LIGHT</h3>
                <p id="light-value">-- Lux</p>
            </div>

        </div>

    </header>


    <div class="chart-container">

        <!-- Chấm màu đánh dấu 3 trục Y -->
        <span class="axis-dot axis-dot-temperature"></span>
        <span class="axis-dot axis-dot-humidity"></span>
        <span class="axis-dot axis-dot-light"></span>

        <canvas id="sensorChart"></canvas>

    </div>

</div>


<div class="panel">

    <h3 class="panel-title">
        Device Control
    </h3>

    <div class="device-list">

        <div class="device-item">
            <span class="device-name">Đèn 1</span>

            <label class="switch">
                <input type="checkbox" id="device1">
                <span class="slider round"></span>
            </label>
        </div>


        <div class="device-item">
            <span class="device-name">Đèn 2</span>

            <label class="switch">
                <input type="checkbox" id="device2">
                <span class="slider round"></span>
            </label>
        </div>


        <div class="device-item">
            <span class="device-name">Đèn 3</span>

            <label class="switch">
                <input type="checkbox" id="device3">
                <span class="slider round"></span>
            </label>
        </div>

    </div>

</div>
