<div class="page-header">
    <h2 class="page-title">Lịch sử điều khiển</h2>
</div>

<div class="table-controls">
    <div class="control-group" style="flex-wrap: wrap; gap: 10px;">
        
        <!-- Sắp xếp theo Thời gian -->
        <select class="control-select" id="sort-history" onchange="applyHistoryFilter()">
            <option value="time_desc">Thời gian: Mới nhất</option>
            <option value="time_asc">Thời gian: Cũ nhất</option>
        </select>

        <!-- Lọc Thiết bị -->
        <select class="control-select" id="filter-device" onchange="applyHistoryFilter()">
            <option value="">Tất cả thiết bị</option>
            <option value="đèn 1">Đèn 1</option>
            <option value="đèn 2">Đèn 2</option>
            <option value="đèn 3">Đèn 3</option>
        </select>

        <!-- Lọc Hành động -->
        <select class="control-select" id="filter-action" onchange="applyHistoryFilter()">
            <option value="">Tất cả hành động</option>
            <option value="bật">Bật</option>
            <option value="tắt">Tắt</option>
        </select>

        <!-- Lọc Trạng thái: success, fail, pending -->
        <select class="control-select" id="filter-status" onchange="applyHistoryFilter()">
            <option value="">Tất cả trạng thái</option>
            <option value="success">Success</option>
            <option value="fail">Fail</option>
            <option value="pending">Pending</option>
        </select>

        <!-- Tìm kiếm theo Thời gian -->
        <div class="search-box">
            <input type="text" class="control-search" id="search-history" placeholder="tìm kiếm theo thời gian">
            <button class="btn-search" onclick="applyHistoryFilter()">Tìm kiếm</button>
        </div>

    </div>
</div>

<div class="panel table-panel">
    <table class="data-table">
        <thead>
            <tr>
                <th>id</th>
                <th>thiết bị</th>
                <th>người dùng</th>
                <th>hành động</th>
                <th>trạng thái</th>
                <th>thời gian</th>
            </tr>
        </thead>
        <tbody id="table-history-body"></tbody>
    </table>
</div>

<!-- Thanh phân trang -->
<div class="pagination-footer">
    <div class="rows-per-page">
        <span>Hiển thị:</span>
        <select id="pagesize-history" onchange="changeHistoryPageSize(this.value)">
            <option value="10">10 dòng</option>
            <option value="20">20 dòng</option>
            <option value="50">50 dòng</option>
        </select>
    </div>
    <div class="pagination-controls">
        <button class="btn-page" onclick="prevHistoryPage()">‹ Trước</button>
        <span id="page-num-history" class="page-current">1</span>
        <button class="btn-page" onclick="nextHistoryPage()">Sau ›</button>
    </div>
    <div class="pagination-info" id="page-info-history">
        Trang 1 / 1 (Tổng 0 bản ghi)
    </div>
</div>
