<div class="page-header">
    <h2 class="page-title">Lịch sử cảm biến</h2>
</div>

<div class="table-controls">
    <div class="control-group" style="flex-wrap: wrap; gap: 10px;">
        
        <!-- 1. Box Sắp xếp thời gian (Sort riêng) -->
        <select class="control-select" id="sort-sensor" onchange="applySensorFilter()">
            <option value="time_desc">Thời gian: Mới nhất</option>
            <option value="time_asc">Thời gian: Cũ nhất</option>
        </select>

        <!-- 2. Box Lọc loại cảm biến (Filter riêng) -->
        <select class="control-select" id="filter-sensor" onchange="applySensorFilter()">
            <option value="">Tất cả loại</option>
            <option value="temp">Nhiệt độ</option>
            <option value="humid">Độ ẩm</option>
            <option value="light">Ánh sáng</option>
            <option value="time">Thời gian</option>
        </select>

        <!-- 3. Ô tìm kiếm từ khóa -->
        <div class="search-box">
            <input type="text" class="control-search" id="search-sensor" placeholder="search . . .">
            <button class="btn-search" onclick="applySensorFilter()">Tìm kiếm</button>
        </div>

    </div>
</div>

<div class="panel table-panel">
    <table class="data-table">
        <thead>
            <tr>
                <th>id</th>
                <th>tên cảm biến</th>
                <th>giá trị</th>
                <th>thời gian</th>
            </tr>
        </thead>
        <tbody id="table-sensor-body"></tbody>
    </table>
</div>

<!-- Thanh phân trang dưới cùng -->
<div class="pagination-footer">
    <div class="rows-per-page">
        <span>Hiển thị:</span>
        <select id="pagesize-sensor" onchange="changeSensorPageSize(this.value)">
            <option value="10">10 dòng</option>
            <option value="20">20 dòng</option>
            <option value="50">50 dòng</option>
        </select>
    </div>
    <div class="pagination-controls">
        <button class="btn-page" onclick="prevSensorPage()">‹ Trước</button>
        <span id="page-num-sensor" class="page-current">1</span>
        <button class="btn-page" onclick="nextSensorPage()">Sau ›</button>
    </div>
    <div class="pagination-info" id="page-info-sensor">
        Trang 1 / 1 (Tổng 0 bản ghi)
    </div>
</div>
